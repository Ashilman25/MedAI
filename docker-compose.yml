services:
  backend:
    build: ./backend
    container_name: medai-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/data:/app/data
  frontend:
    image: node:20
    container_name: medai-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    command: bash -lc "npm install && npm install -D @vitejs/plugin-react && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_BASE_URL=http://backend:8000
      - VITE_MOCK_MODE=false
    depends_on:
      - backend
